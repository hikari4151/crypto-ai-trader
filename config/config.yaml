default_exchange: binance
default_symbol: BTC/USDT
default_timeframe: 1h
default_start_cash: 10000.0
default_strategy: dual_ma
trading_auto_start: false
ai_market_analysis_interval: 600
ai_optimize_interval: 86400
ai_review_interval: 604800
ai_optimize_validate: true
ai_optimize_validation_bars: 800
paper_slippage: 0.0005
trade_on_open: false
protective_stop_enabled: true
protective_stop_default_pct: 0.07
protective_stop_buffer_pct: 0.02
proxy_url: ''
evolve_enabled: true
evolve_factor_miner_interval: 60
evolve_strategy_drl_interval: 60
evolve_rolling_window: 5000
evolve_factor_miner_episodes: 8
evolve_factor_miner_fitness_mode: net
evolve_factor_miner_cost_per_turn: 0.002
evolve_factor_miner_net_fitness_scale: 500.0
evolve_strategy_drl_episodes: 8
# P0 并行采样上量（2026-10）：批量 8→16（每轮见过的局面翻倍，PPO 梯度更稳）；
# collect_workers=0 自动按 CPU 核数并行收集（此前硬编码 4 线程是吞吐瓶颈）。
evolve_strategy_drl_n_episodes: 16
evolve_strategy_drl_collect_workers: 0
# P1 课程学习（能力层次）：早期只采低波动段、随进度放开。默认关闭（向后兼容）。
evolve_strategy_drl_curriculum: false
evolve_strategy_drl_curriculum_start: 0.3
# P1 时序网络升级：actor 骨干。mlp=默认（向后兼容）；gru=GRU 序列编码（能力更强，
# Pine 导出走蒸馏——GRU teacher 自动蒸馏成 MLP student 供 TradingView）。
evolve_strategy_drl_backbone: mlp
evolve_strategy_drl_gru_hidden: 32
evolve_strategy_drl_ppo_epochs: 8
evolve_strategy_drl_walkforward_obs: true
evolve_strategy_drl_walkforward_folds: 2
evolve_strategy_drl_walkforward_bars: 6000
evolve_walkforward_min_trades: 8
evolve_strategy_drl_reset_after_rejects: 5
evolve_gap01_obs: true
evolve_gap01_folds: 4
evolve_gap01_bars: 15000
evolve_gap01_min_trades: 8
evolve_gap01_cost_multiplier: 2.0
evolve_gap01_fail_reset_after: 3
evolve_gap01_stable_pass_required: 3
evolve_strategy_drl_longwindow_obs: true
evolve_strategy_drl_longwindow_30d_bars: 8640
evolve_strategy_drl_longwindow_90d_bars: 25920
evolve_strategy_drl_longwindow_every_n: 5
evolve_strategy_drl_deploy_requires_longwindow: true
evolve_strategy_drl_deploy_longwindow_90d: false
evolve_strategy_drl_state_window: 4
evolve_strategy_drl_min_trade_zone: 0.10
evolve_strategy_drl_hidden:
- 16
- 16
evolve_strategy_drl_replay_capacity: 64
evolve_strategy_drl_replay_mix_ratio: 0.3
evolve_rollback_threshold: 0.95
evolve_max_versions: 10
evolve_symbols:
- ETH/USDT
evolve_timeframe: 5m
# AI 数学期望信号门（§19 落地）：buy 信号期望 < 阈值则拦截新开多
signal_math_ev_gate: true
signal_math_ev_min: 0.0
